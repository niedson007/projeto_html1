<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Contato - Meu Projeto</title>
</head>
<body>

    <nav>
        <h2>Menu de Navegação</h2>
        <ul>
            <li><a href="inicio.html">Página 1: Início</a></li>
            <li><a href="sobre.html">Página 2: Sobre Mim</a></li>

        </ul>

    <hr>
    <h1>Formulário</h1>
    <p>Preencha os formulário abaixo:</p>

    <form action="#" method="post">
        
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome"><br><br>

            <label for="turno">Selecione seu Turno:</label>
            <select id="turno" name="turno">
                <option value="manha">Manhã</option>
                <option value="tarde">Tarde</option>
                <option value="noite">Noite</option>
            </select>
        </fieldset>
        <br>

        <fieldset>
            <legend>Preferências de Estudo</legend>
            
            <p>Qual a sua área favorita?</p>
            <input type="radio" id="front" name="area" value="frontend">
            <label for="front">Front-End</label><br>
            
            <input type="radio" id="back" name="area" value="backend">
            <label for="back">Back-End</label><br>

            <p>Quais tecnologias você já usou?</p>
            <input type="checkbox" id="html" name="tech" value="html">
            <label for="html">HTML</label><br>
            
            <input type="checkbox" id="css" name="tech" value="css">
            <label for="css">CSS</label><br>
            
            <input type="checkbox" id="js" name="tech" value="javascript">
            <label for="js">JavaScript</label><br>
        </fieldset>
        <br>

        <button type="submit">Enviar Formulário</button>
        <button type="reset">Limpar Dados</button>

    </form>
</body>
</html>
